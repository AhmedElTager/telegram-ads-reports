<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>لوحة إدارة تقارير إعلانات تيليجرام</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 18px 20px;
      font-size: 21px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .container {
      max-width: 950px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9dd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #229ed9;
      box-shadow: 0 0 0 2px rgba(34,158,217,.1);
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      background: #229ed9;
      color: #fff;
    }

    .success {
      background: #16834b;
      color: #fff;
    }

    .danger {
      background: #d64545;
      color: #fff;
    }

    .secondary {
      background: #eef1f4;
      color: #333;
    }

    .refresh {
      background: #6c5ce7;
      color: #fff;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .message {
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
      line-height: 1.7;
      word-break: break-word;
    }

    .success-message {
      background: #e7f7ed;
      color: #16834b;
    }

    .error-message {
      background: #fdecec;
      color: #b42318;
    }

    .campaign-list {
      margin-top: 15px;
    }

    .campaign-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .campaign-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .campaign-title {
      font-size: 19px;
      font-weight: bold;
    }

    .campaign-code {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .status-badge {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .active {
      background: #e7f7ed;
      color: #16834b;
    }

    .inactive {
      background: #fce8e8;
      color: #c0392b;
    }

    .campaign-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .info-box {
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 12px;
    }

    .info-title {
      color: #777;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-value {
      font-weight: bold;
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .report-link,
    .telegram-link {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      word-break: break-all;
      direction: ltr;
      text-align: left;
      font-size: 13px;
    }

    .telegram-link {
      background: #eef8fc;
      border-color: #c9e9f5;
    }

    .hint {
      color: #777;
      font-size: 13px;
      line-height: 1.7;
      margin-top: -8px;
      margin-bottom: 15px;
    }

    .hidden {
      display: none !important;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 650px) {

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .campaign-info {
        grid-template-columns: 1fr;
      }

      .topbar {
        font-size: 17px;
        padding: 15px;
      }

      .topbar > div:first-child {
        max-width: 60%;
        line-height: 1.4;
      }

      .card {
        padding: 18px;
      }

      button {
        width: 100%;
      }

      .actions button,
      .top-actions button {
        width: 100%;
      }
    }

  </style>

</head>


<body>


  <!-- TOP BAR -->

  <div class="topbar">

    <div>
      📊 لوحة إدارة تقارير إعلانات تيليجرام
    </div>

    <div class="top-actions">

      <button
        id="refreshButton"
        class="refresh"
        type="button"
      >
        🔄 تحديث
      </button>

    </div>

  </div>


  <div class="container">


    <!-- ADD CAMPAIGN -->

    <div class="card">

      <h2>
        ➕ إضافة إعلان جديد
      </h2>

      <p style="color:#777; line-height:1.7;">
        أضيفي بيانات الإعلان الحقيقي، وسيتم إنشاء رابط تقرير للعميل.
      </p>


      <div
        id="addMessage"
        class="message"
      ></div>


      <div class="form-row">

        <div>

          <label>
            اسم الحملة / العميل
          </label>

          <input
            id="addCampaignName"
            type="text"
            placeholder="مثال: حملة أحمد"
          >

        </div>


        <div>

          <label>
            Report Code
          </label>

          <input
            id="addReportCode"
            type="text"
            placeholder="مثال: AHMED-001"
          >

        </div>

      </div>


      <div class="form-row">

        <div>

          <label>
            مرات الظهور
          </label>

          <input
            id="addImpressions"
            type="number"
            min="0"
            value="0"
          >

        </div>


        <div>

          <label>
            حالة الإعلان
          </label>

          <select id="addStatus">

            <option value="Active">
              Active
            </option>

            <option value="Paused">
              Paused
            </option>

            <option value="Completed">
              Completed
            </option>

            <option value="Inactive">
              Inactive
            </option>

          </select>

        </div>

      </div>


      <!-- TELEGRAM STATS URL -->

      <label>
        🔗 رابط إحصائيات الإعلان الحقيقي
      </label>

      <input
        id="addStatsUrl"
        type="url"
        placeholder="https://ads.telegram.org/stats/XXXXXXXX"
        dir="ltr"
      >

      <div class="hint">
        ضعي هنا رابط Statistics الخاص بالإعلان الحقيقي من Telegram Ads.
      </div>


      <!-- AD TEXT -->

      <label>
        نص الإعلان
      </label>

      <textarea
        id="addAdText"
        placeholder="اكتبي نص الإعلان هنا"
      ></textarea>


      <!-- IMAGE -->

      <label>
        صورة الإعلان — رابط الصورة
      </label>

      <input
        id="addAdImage"
        type="url"
        placeholder="https://example.com/image.jpg"
        dir="ltr"
      >


      <!-- CHANNEL -->

      <label>
        رابط القناة / البوت
      </label>

      <input
        id="addChannelUrl"
        type="url"
        placeholder="https://t.me/example"
        dir="ltr"
      >


      <button
        id="addButton"
        class="success"
        type="button"
      >
        ➕ إضافة الإعلان
      </button>

    </div>



    <!-- EDIT CAMPAIGN -->

    <div class="card">

      <h2>
        ✏️ تعديل إعلان
      </h2>

      <p style="color:#777;">
        اختاري الإعلان الذي تريدين تعديله.
      </p>


      <div
        id="editMessage"
        class="message"
      ></div>


      <label>
        الإعلان
      </label>

      <select id="campaignSelect">

        <option value="">
          جاري تحميل الإعلانات...
        </option>

      </select>


      <div
        id="editForm"
        class="hidden"
      >


        <div class="form-row">

          <div>

            <label>
              اسم الحملة
            </label>

            <input
              id="editCampaignName"
              type="text"
            >

          </div>


          <div>

            <label>
              Report Code
            </label>

            <input
              id="editReportCode"
              type="text"
            >

          </div>

        </div>


        <div class="form-row">

          <div>

            <label>
              مرات الظهور
            </label>

            <input
              id="editImpressions"
              type="number"
              min="0"
            >

          </div>


          <div>

            <label>
              حالة الإعلان
            </label>

            <select id="editStatus">

              <option value="Active">
                Active
              </option>

              <option value="Paused">
                Paused
              </option>

              <option value="Completed">
                Completed
              </option>

              <option value="Inactive">
                Inactive
              </option>

            </select>

          </div>

        </div>


        <label>
          🔗 رابط إحصائيات الإعلان الحقيقي
        </label>

        <input
          id="editStatsUrl"
          type="url"
          placeholder="https://ads.telegram.org/stats/XXXXXXXX"
          dir="ltr"
        >


        <label>
          نص الإعلان
        </label>

        <textarea
          id="editAdText"
        ></textarea>


        <label>
          صورة الإعلان
        </label>

        <input
          id="editAdImage"
          type="url"
          placeholder="https://example.com/image.jpg"
          dir="ltr"
        >


        <label>
          رابط القناة / البوت
        </label>

        <input
          id="editChannelUrl"
          type="url"
          placeholder="https://t.me/example"
          dir="ltr"
        >


        <div class="actions">

          <button
            id="saveButton"
            class="primary"
            type="button"
          >
            💾 حفظ التعديلات
          </button>


          <button
            id="deleteButton"
            class="danger"
            type="button"
          >
            🗑️ حذف الإعلان
          </button>

        </div>


        <div
          id="reportLinkBox"
          class="report-link hidden"
        ></div>


        <div
          id="telegramLinkBox"
          class="telegram-link hidden"
        ></div>


        <div
          class="actions"
          style="margin-top:10px;"
        >

          <button
            id="copyLinkButton"
            class="secondary"
            type="button"
          >
            📋 نسخ رابط التقرير
          </button>


          <button
            id="openLinkButton"
            class="secondary"
            type="button"
          >
            🔗 فتح التقرير
          </button>

        </div>


      </div>

    </div>



    <!-- CAMPAIGNS -->

    <div class="card">

      <h2>
        📋 قائمة الإعلانات
      </h2>


      <div
        id="campaignsLoading"
        class="loading"
      >
        جاري تحميل الإعلانات...
      </div>


      <div
        id="campaignList"
        class="campaign-list"
      ></div>

    </div>


  </div>



  <script>


    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://oxclimxygexnezblrhpz.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_LakP2nXyrFIvnpwzj8GEvA_90dL9_LK";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       REPORT URL
    ===================================== */

    const REPORT_BASE_URL =
      "https://ahmedeltager.github.io/telegram-ads-reports/";


    /* =====================================
       DATA
    ===================================== */

    let campaigns = [];

    let selectedCampaignId = null;


    /* =====================================
       ELEMENTS
    ===================================== */

    const addButton =
      document.getElementById("addButton");

    const refreshButton =
      document.getElementById("refreshButton");

    const campaignSelect =
      document.getElementById("campaignSelect");

    const editForm =
      document.getElementById("editForm");

    const saveButton =
      document.getElementById("saveButton");

    const deleteButton =
      document.getElementById("deleteButton");

    const copyLinkButton =
      document.getElementById("copyLinkButton");

    const openLinkButton =
      document.getElementById("openLinkButton");


    /* =====================================
       MESSAGES
    ===================================== */

    function showMessage(
      element,
      text,
      type = "error"
    ) {

      element.textContent = text;

      element.className =
        "message " +
        (
          type === "success"
            ? "success-message"
            : "error-message"
        );

      element.style.display = "block";

    }


    function hideMessage(element) {

      element.textContent = "";

      element.style.display = "none";

    }


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =====================================
       REPORT LINK
    ===================================== */

    function createReportLink(code) {

      if (!code) {
        return REPORT_BASE_URL;
      }

      return (
        REPORT_BASE_URL +
        "?code=" +
        encodeURIComponent(code)
      );

    }


    /* =====================================
       TELEGRAM URL
    ===================================== */

    function createTelegramStatsLink(url) {

      return url || "";

    }


    /* =====================================
       LOAD CAMPAIGNS
    ===================================== */

    async function loadCampaigns() {

      const loading =
        document.getElementById(
          "campaignsLoading"
        );

      const list =
        document.getElementById(
          "campaignList"
        );


      loading.style.display = "block";


      const result =
        await supabaseClient
          .from("campaigns")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      loading.style.display = "none";


      if (result.error) {

        console.error(
          "Load campaigns error:",
          result.error
        );

        list.innerHTML =
          `
          <div class="empty">
            ❌ حدث خطأ أثناء تحميل الإعلانات.
            <br><br>
            ${escapeHtml(
              result.error.message
            )}
          </div>
          `;

        return;

      }


      campaigns =
        result.data || [];


      renderCampaigns();

      fillCampaignSelect();

    }


    /* =====================================
       RENDER CAMPAIGNS
    ===================================== */

    function renderCampaigns() {

      const list =
        document.getElementById(
          "campaignList"
        );


      if (!campaigns.length) {

        list.innerHTML =
          `
          <div class="empty">
            لا توجد إعلانات حتى الآن.
          </div>
          `;

        return;

      }


      list.innerHTML =
        campaigns
          .map(function(campaign) {

            const reportLink =
              createReportLink(
                campaign.report_code
              );


            const statusClass =
              campaign.status === "Active"
                ? "active"
                : "inactive";


            return `

              <div class="campaign-item">

                <div class="campaign-header">

                  <div>

                    <div class="campaign-title">
                      ${escapeHtml(
                        campaign.campaign_name ||
                        "بدون اسم"
                      )}
                    </div>

                    <div class="campaign-code">
                      Report Code:
                      ${escapeHtml(
                        campaign.report_code ||
                        "—"
                      )}
                    </div>

                  </div>


                  <span class="status-badge ${statusClass}">
                    ${escapeHtml(
                      campaign.status ||
                      "غير معروف"
                    )}
                  </span>

                </div>


                <div class="campaign-info">


                  <div class="info-box">

                    <div class="info-title">
                      👁️ المشاهدات
                    </div>

                    <div class="info-value">
                      ${Number(
                        campaign.impressions || 0
                      ).toLocaleString("en-US")}
                    </div>

                  </div>


                  <div class="info-box">

                    <div class="info-title">
                      🔗 رابط الإعلان
                    </div>

                    <div class="info-value">
                      ${
                        campaign.stats_url
                          ? "متوفر"
                          : "غير مضاف"
                      }
                    </div>

                  </div>


                </div>


                ${
                  campaign.stats_url
                    ? `
                      <div class="telegram-link">
                        ${escapeHtml(
                          campaign.stats_url
                        )}
                      </div>
                    `
                    : ""
                }


                <div class="report-link">

                  <strong>
                    رابط العميل:
                  </strong>

                  <br><br>

                  ${escapeHtml(
                    reportLink
                  )}

                </div>


                <div
                  class="actions"
                  style="margin-top:12px;"
                >

                  <button
                    class="primary"
                    type="button"
                    onclick="selectCampaign('${campaign.id}')"
                  >
                    ✏️ تعديل
                  </button>


                  <button
                    class="secondary"
                    type="button"
                    onclick="copyText('${reportLink}')"
                  >
                    📋 نسخ رابط العميل
                  </button>


                  <button
                    class="secondary"
