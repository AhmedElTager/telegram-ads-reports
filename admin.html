<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>لوحة إدارة تقارير إعلانات تيليجرام</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 18px 20px;
      font-size: 21px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .container {
      max-width: 950px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .login-card {
      max-width: 500px;
      margin: 60px auto;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .logo {
      text-align: center;
      font-size: 50px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9dd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
      background: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #229ed9;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      background: #229ed9;
      color: #fff;
    }

    .success {
      background: #16834b;
      color: #fff;
    }

    .danger {
      background: #d64545;
      color: #fff;
    }

    .secondary {
      background: #eef1f4;
      color: #333;
    }

    .logout {
      background: #fce8e8;
      color: #c0392b;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .message {
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
      line-height: 1.7;
    }

    .success-message {
      background: #e7f7ed;
      color: #16834b;
    }

    .error-message {
      background: #fdecec;
      color: #b42318;
    }

    .campaign-list {
      margin-top: 15px;
    }

    .campaign-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .campaign-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .campaign-title {
      font-size: 19px;
      font-weight: bold;
    }

    .campaign-code {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .status-badge {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .active {
      background: #e7f7ed;
      color: #16834b;
    }

    .inactive {
      background: #fce8e8;
      color: #c0392b;
    }

    .campaign-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .info-box {
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 12px;
    }

    .info-title {
      color: #777;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-value {
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .report-link {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      word-break: break-all;
      direction: ltr;
      text-align: left;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 650px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .campaign-info {
        grid-template-columns: 1fr;
      }

      .topbar {
        font-size: 17px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->

  <div class="topbar">

    <div>
      📊 لوحة إدارة تقارير إعلانات تيليجرام
    </div>

    <button
      id="logoutButton"
      class="logout hidden"
      type="button"
    >
      🚪 تسجيل الخروج
    </button>

  </div>


  <div class="container">

    <!-- LOGIN -->

    <div
      id="loginSection"
      class="card login-card"
    >

      <div class="logo">
        🔐
      </div>

      <h1 style="text-align:center;">
        دخول الإدارة
      </h1>

      <div class="subtitle">
        هذه الصفحة مخصصة لإدارة تقارير العملاء.
      </div>

      <div
        id="loginMessage"
        class="message"
      ></div>

      <label>
        البريد الإلكتروني
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
      >

      <label>
        كلمة المرور
      </label>

      <input
        id="loginPassword"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        class="primary"
        style="width:100%;"
        type="button"
      >
        🔐 تسجيل الدخول
      </button>

    </div>


    <!-- ADMIN -->

    <div
      id="adminSection"
      class="hidden"
    >

      <!-- ADD CAMPAIGN -->

      <div class="card">

        <h2>
          ➕ إضافة عميل / حملة جديدة
        </h2>

        <p style="color:#777;">
          أضيفي بيانات العميل والحملة، وسيتم إنشاء رابط التقرير تلقائيًا.
        </p>

        <div
          id="addMessage"
          class="message"
        ></div>

        <div class="form-row">

          <div>

            <label>
              اسم الحملة / العميل
            </label>

            <input
              id="addCampaignName"
              type="text"
              placeholder="مثال: حملة شركة حور"
            >

          </div>

          <div>

            <label>
              Report Code
            </label>

            <input
              id="addReportCode"
              type="text"
              placeholder="مثال: HOR-001"
            >

          </div>

        </div>


        <div class="form-row">

          <div>

            <label>
              مرات الظهور
            </label>

            <input
              id="addImpressions"
              type="number"
              min="0"
              value="0"
            >

          </div>


          <div>

            <label>
              حالة الحملة
            </label>

            <select id="addStatus">

              <option value="Active">
                Active
              </option>

              <option value="Paused">
                Paused
              </option>

              <option value="Completed">
                Completed
              </option>

              <option value="Inactive">
                Inactive
              </option>

            </select>

          </div>

        </div>


        <label>
          نص الإعلان
        </label>

        <textarea
          id="addAdText"
          placeholder="اكتب نص الإعلان هنا"
        ></textarea>


        <label>
          صورة الإعلان — رابط الصورة
        </label>

        <input
          id="addAdImage"
          type="url"
          placeholder="https://example.com/image.jpg"
        >


        <label>
          رابط القناة
        </label>

        <input
          id="addChannelUrl"
          type="url"
          placeholder="https://t.me/example"
        >


        <button
          id="addButton"
          class="success"
          type="button"
        >
          ➕ إضافة الحملة
        </button>

      </div>


      <!-- EDIT -->

      <div class="card">

        <h2>
          ✏️ تعديل حملة
        </h2>

        <p style="color:#777;">
          اختاري الحملة التي تريدين تعديلها.
        </p>

        <div
          id="editMessage"
          class="message"
        ></div>


        <label>
          الحملة
        </label>

        <select id="campaignSelect">

          <option value="">
            جاري تحميل الحملات...
          </option>

        </select>


        <div
          id="editForm"
          class="hidden"
        >

          <div class="form-row">

            <div>

              <label>
                اسم الحملة
              </label>

              <input
                id="editCampaignName"
                type="text"
              >

            </div>


            <div>

              <label>
                Report Code
              </label>

              <input
                id="editReportCode"
                type="text"
              >

            </div>

          </div>


          <div class="form-row">

            <div>

              <label>
                مرات الظهور
              </label>

              <input
                id="editImpressions"
                type="number"
                min="0"
              >

            </div>


            <div>

              <label>
                حالة الحملة
              </label>

              <select id="editStatus">

                <option value="Active">
                  Active
                </option>

                <option value="Paused">
                  Paused
                </option>

                <option value="Completed">
                  Completed
                </option>

                <option value="Inactive">
                  Inactive
                </option>

              </select>

            </div>

          </div>


          <label>
            نص الإعلان
          </label>

          <textarea
            id="editAdText"
          ></textarea>


          <label>
            صورة الإعلان — رابط الصورة
          </label>

          <input
            id="editAdImage"
            type="url"
            placeholder="https://example.com/image.jpg"
          >


          <label>
            رابط القناة
          </label>

          <input
            id="editChannelUrl"
            type="url"
            placeholder="https://t.me/example"
          >


          <div class="actions">

            <button
              id="saveButton"
              class="primary"
              type="button"
            >
              💾 حفظ التعديلات
            </button>

            <button
              id="deleteButton"
              class="danger"
              type="button"
            >
              🗑️ حذف الحملة
            </button>

          </div>


          <div
            id="reportLinkBox"
            class="report-link hidden"
          ></div>


          <div
            class="actions"
            style="margin-top:10px;"
          >

            <button
              id="copyLinkButton"
              class="secondary"
              type="button"
            >
              📋 نسخ رابط التقرير
            </button>

            <button
              id="openLinkButton"
              class="secondary"
              type="button"
            >
              🔗 فتح التقرير
            </button>

          </div>

        </div>

      </div>


      <!-- CAMPAIGNS -->

      <div class="card">

        <h2>
          📋 الحملات الموجودة
        </h2>

        <div
          id="campaignsLoading"
          class="loading"
        >
          جاري تحميل الحملات...
        </div>

        <div
          id="campaignList"
          class="campaign-list"
        ></div>

      </div>

    </div>

  </div>


  <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://oxclimxygexnezblrhpz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LakP2nXyrFIvnpwzj8GEvA_90dL9_LK";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       REPORT URL
    ===================================== */

    const REPORT_BASE_URL =
      "https://ahmedeltager.github.io/telegram-ads-reports/";


    /* =====================================
       ELEMENTS
    ===================================== */

    const loginSection =
      document.getElementById("loginSection");

    const adminSection =
      document.getElementById("adminSection");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const loginEmail =
      document.getElementById("loginEmail");

    const loginPassword =
      document.getElementById("loginPassword");

    const loginMessage =
      document.getElementById("loginMessage");


    let campaigns = [];

    let selectedCampaignId = null;


    /* =====================================
       MESSAGE
    ===================================== */

    function showMessage(
      element,
      text,
      type
    ) {

      element.textContent = text;

      element.className =
        "message " +
        (
          type === "success"
            ? "success-message"
            : "error-message"
        );

      element.style.display = "block";

    }


    function hideMessage(element) {

      element.style.display = "none";

    }


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =====================================
       REPORT LINK
    ===================================== */

    function createReportLink(code) {

      if (!code) {
        return REPORT_BASE_URL;
      }

      return (
        REPORT_BASE_URL +
        "?code=" +
        encodeURIComponent(code)
      );

    }


    /* =====================================
       LOGIN
    ===================================== */

    async function login() {

      const email =
        loginEmail.value.trim();

      const password =
        loginPassword.value;

      hideMessage(loginMessage);

      if (!email || !password) {

        showMessage(
          loginMessage,
          "اكتبي البريد الإلكتروني وكلمة المرور.",
          "error"
        );

        return;

      }


      loginButton.disabled = true;

      loginButton.textContent =
        "جاري تسجيل الدخول...";


      try {

        const result =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (result.error) {

          console.error(
            "Login error:",
            result.error
          );

          showMessage(
            loginMessage,
            "❌ " + (
              result.error.message ||
              "فشل تسجيل الدخول."
            ),
            "error"
          );

          return;

        }


        await checkSession();

      }

      catch (error) {

        console.error(error);

        showMessage(
          loginMessage,
          "❌ حدث خطأ أثناء الاتصال بـ Supabase.",
          "error"
        );

      }

      finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "🔐 تسجيل الدخول";

      }

    }


    /* =====================================
       LOGOUT
    ===================================== */

    async function logout() {

      await supabaseClient.auth.signOut();

      loginSection.classList.remove("hidden");

      adminSection.classList.add("hidden");

      logoutButton.classList.add("hidden");

      loginPassword.value = "";

    }


    /* =====================================
       CHECK SESSION
    ===================================== */

    async function checkSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(error);

          return;

        }


        if (
          data &&
          data.session
        ) {

          loginSection.classList.add("hidden");

          adminSection.classList.remove("hidden");

          logoutButton.classList.remove("hidden");

          await loadCampaigns();

        }

        else {

          loginSection.classList.remove("hidden");

          adminSection.classList.add("hidden");

          logoutButton.classList.add("hidden");

        }

      }

      catch (error) {

        console.error(error);

      }

    }


    /* =====================================
       LOAD CAMPAIGNS
    ===================================== */

    async function loadCampaigns() {

      const loading =
        document.getElementById(
          "campaignsLoading"
        );

      const list =
        document.getElementById(
          "campaignList"
        );


      loading.style.display = "block";


      const {
        data,
        error
      } =
        await supabaseClient
          .from("campaigns")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      loading.style.display = "none";


      if (error) {

        console.error(error);

        list.innerHTML =
          "<div class='empty'>❌ حدث خطأ أثناء تحميل الحملات.</div>";

        return;

      }


      campaigns =
        data || [];


      renderCampaigns();

      fillCampaignSelect();

    }


    /* =====================================
       RENDER
    ===================================== */

    function renderCampaigns() {

      const list =
        document.getElementById(
          "campaignList"
        );


      if (!campaigns.length) {

        list.innerHTML =
          "<div class='empty'>لا توجد حملات حتى الآن.</div>";

        return;

      }


      list.innerHTML =
        campaigns
          .map(campaign => {

            const link =
              createReportLink(
                campaign.report_code
              );


            const statusClass =
              campaign.status === "Active"
                ? "active"
                : "inactive";


            return `

              <div class="campaign-item">

                <div class="campaign-header">

                  <div>

                    <div class="campaign-title">
                      ${escapeHtml(
                        campaign.campaign_name ||
                        "بدون اسم"
                      )}
                    </div>

                    <div class="campaign-code">
                      Report Code:
                      ${escapeHtml(
                        campaign.report_code ||
                        "—"
                      )}
                    </div>

                  </div>

                  <span class="status-badge ${statusClass}">
                    ${escapeHtml(
                      campaign.status ||
                      "غير معروف"
                    )}
                  </span>

                </div>


                <div class="campai
