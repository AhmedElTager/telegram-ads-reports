<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة إدارة تقارير إعلانات تيليجرام</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 18px 20px;
      font-size: 21px;
      font-weight: bold;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    h1,
    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #229ed9;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary {
      background: #555;
    }

    .success {
      background: #e7f7ed;
      color: #16834b;
    }

    .error {
      background: #fdecec;
      color: #b42318;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 8px;
      line-height: 1.7;
    }

    .info {
      margin-top: 15px;
      padding: 15px;
      background: #f4f6f8;
      border-radius: 8px;
      line-height: 1.9;
    }

    .report-link {
      margin-top: 15px;
      padding: 12px;
      background: #eef7ff;
      border-radius: 8px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 20px;
    }

    .divider {
      border: 0;
      border-top: 1px solid #eee;
      margin: 25px 0;
    }

    .danger {
      background: #c0392b;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px auto;
      }

      .card {
        padding: 18px;
      }

      .topbar {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    📊 لوحة إدارة تقارير إعلانات تيليجرام
  </div>

  <div class="container">

    <!-- =========================
         ADD NEW CAMPAIGN
    ========================== -->

    <div class="card">

      <h1>➕ إضافة حملة جديدة</h1>

      <p>
        أضيفي بيانات العميل والحملة، وسيتم إنشاء رابط التقرير تلقائيًا.
      </p>

      <label>
        اسم الحملة
      </label>

      <input
        id="newCampaignName"
        type="text"
        placeholder="مثال: حملة شركة حور"
      >

      <label>
        Report Code
      </label>

      <input
        id="newReportCode"
        type="text"
        placeholder="مثال: HOR-001"
      >

      <div class="small">
        استخدمي كود مختلف لكل تقرير.
      </div>

      <label>
        مرات الظهور
      </label>

      <input
        id="newImpressions"
        type="number"
        min="0"
        value="0"
      >

      <label>
        حالة الحملة
      </label>

      <select id="newStatus">

        <option value="Active">
          Active
        </option>

        <option value="Paused">
          Paused
        </option>

        <option value="Completed">
          Completed
        </option>

      </select>

      <label>
        نص الإعلان
      </label>

      <textarea
        id="newAdText"
        placeholder="اكتب نص الإعلان هنا"
      ></textarea>

      <label>
        صورة الإعلان — رابط الصورة
      </label>

      <input
        id="newAdImage"
        type="url"
        placeholder="https://example.com/image.jpg"
      >

      <label>
        رابط القناة
      </label>

      <input
        id="newChannelUrl"
        type="url"
        placeholder="https://t.me/example"
      >

      <button id="addButton">
        ➕ إضافة الحملة
      </button>

      <div
        id="addMessage"
        class="message"
      ></div>

    </div>


    <!-- =========================
         EDIT CAMPAIGN
    ========================== -->

    <div class="card">

      <h1>✏️ تعديل حملة</h1>

      <p>
        اختاري الحملة التي تريدين تعديلها.
      </p>

      <label>
        الحملة
      </label>

      <select id="campaignSelect">
        <option value="">
          جاري تحميل الحملات...
        </option>
      </select>

      <div
        id="campaignInfo"
        class="info"
      >
        اختر حملة لعرض بياناتها.
      </div>

      <label>
        مرات الظهور
      </label>

      <input
        id="impressions"
        type="number"
        min="0"
      >

      <label>
        حالة الحملة
      </label>

      <select id="status">

        <option value="Active">
          Active
        </option>

        <option value="Paused">
          Paused
        </option>

        <option value="Completed">
          Completed
        </option>

      </select>

      <label>
        نص الإعلان
      </label>

      <textarea
        id="adText"
        placeholder="اكتب نص الإعلان هنا"
      ></textarea>

      <label>
        صورة الإعلان — رابط الصورة
      </label>

      <input
        id="adImage"
        type="url"
        placeholder="https://example.com/image.jpg"
      >

      <label>
        رابط القناة
      </label>

      <input
        id="channelUrl"
        type="url"
        placeholder="https://t.me/example"
      >

      <button id="saveButton">
        💾 حفظ التعديلات
      </button>

      <div
        id="saveMessage"
        class="message"
      ></div>

      <div
        id="reportLinkBox"
        style="display:none;"
      >

        <label>
          🔗 رابط التقرير
        </label>

        <div
          id="reportLink"
          class="report-link"
        ></div>

      </div>

    </div>

  </div>


  <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://oxclimxygexnezblrhpz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LakP2nXyrFIvnpwzj8GEvA_90dL9_LK";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       VARIABLES
    ===================================== */

    let campaigns = [];


    /* =====================================
       ELEMENTS
    ===================================== */

    const campaignSelect =
      document.getElementById(
        "campaignSelect"
      );

    const impressionsInput =
      document.getElementById(
        "impressions"
      );

    const statusInput =
      document.getElementById(
        "status"
      );

    const adTextInput =
      document.getElementById(
        "adText"
      );

    const adImageInput =
      document.getElementById(
        "adImage"
      );

    const channelUrlInput =
      document.getElementById(
        "channelUrl"
      );

    const campaignInfo =
      document.getElementById(
        "campaignInfo"
      );

    const saveButton =
      document.getElementById(
        "saveButton"
      );

    const saveMessage =
      document.getElementById(
        "saveMessage"
      );

    const addButton =
      document.getElementById(
        "addButton"
      );

    const addMessage =
      document.getElementById(
        "addMessage"
      );


    /* =====================================
       SHOW MESSAGE
    ===================================== */

    function showMessage(
      element,
      text,
      success
    ) {

      element.textContent =
        text;

      element.style.display =
        "block";

      element.className =
        success
          ? "message success"
          : "message error";

    }


    /* =====================================
       LOAD CAMPAIGNS
    ===================================== */

    async function loadCampaigns() {

      try {

        const {
          data,
          error
        } = await supabaseClient

          .from("campaigns")

          .select("*")

          .order(
            "created_at",
            {
              ascending: false
            }
          );


        if (error) {
          throw error;
        }


        campaigns =
          data || [];


        campaignSelect.innerHTML = "";


        if (
          campaigns.length === 0
        ) {

          campaignSelect.innerHTML =
            '<option value="">لا توجد حملات</option>';

          campaignInfo.textContent =
            "لا توجد حملات في قاعدة البيانات.";

          return;

        }


        campaigns.forEach(
          function(campaign) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              campaign.id;

            option.textContent =
              campaign.campaign_name ||
              "حملة بدون اسم";

            campaignSelect.appendChild(
              option
            );

          }
        );


        loadSelectedCampaign();


      } catch (error) {

        console.error(error);

        showMessage(
          saveMessage,
          "❌ خطأ في تحميل الحملات: " +
          error.message,
          false
        );

      }

    }


    /* =====================================
       LOAD SELECTED
    ===================================== */

    function loadSelectedCampaign() {

      const id =
        campaignSelect.value;


      const campaign =
        campaigns.find(
          function(item) {

            return String(item.id) ===
              String(id);

          }
        );


      if (!campaign) {
        return;
      }


      impressionsInput.value =
        campaign.impressions ?? 0;


      statusInput.value =
        campaign.status ||
        "Active";


      adTextInput.value =
        campaign.ad_text ||
        "";


      adImageInput.value =
        campaign.ad_image ||
        "";


      channelUrlInput.value =
        campaign.channel_url ||
        "";


      campaignInfo.innerHTML =
        "<strong>اسم الحملة:</strong> " +
        escapeHtml(
          campaign.campaign_name ||
          "—"
        ) +
        "<br>" +

        "<strong>Report Code:</strong> " +
        escapeHtml(
          campaign.report_code ||
          "—"
        );


      createReportLink(
        campaign.report_code
      );

    }


    /* =====================================
       CREATE REPORT LINK
    ===================================== */

    function createReportLink(
      reportCode
    ) {

      const box =
        document.getElementById(
          "reportLinkBox"
        );

      const link =
        document.getElementById(
          "reportLink"
        );


      if (!reportCode) {

        box.style.display =
          "none";

        return;

      }


      const baseUrl =
        window.location.origin +
        window.location.pathname
          .replace(
            "admin.html",
            ""
          );


      const url =
        baseUrl +
        "?code=" +
        encodeURIComponent(
          reportCode
        );


      link.textContent =
        url;


      box.style.display =
        "block";

    }


    /* =====================================
       ADD NEW CAMPAIGN
    ===================================== */

    addButton.addEventListener(
      "click",
      async function() {

        const name =
          document.getElementById(
            "newCampaignName"
          ).value.trim();


        const reportCode =
          document.getElementById(
            "newReportCode"
          ).value.trim();


        const impressions =
          Number(
            document.getElementById(
              "newImpressions"
            ).value || 0
          );


        const status =
          document.getElementById(
            "newStatus"
          ).value;


        const adText =
          document.getElementById(
            "newAdText"
          ).value.trim();


        const adImage =
          document.getElementById(
            "newAdImage"
          ).value.trim();


        const channelUrl =
          document.getElementById(
            "newChannelUrl"
          ).value.trim();


        if (!name) {

          showMessage(
            addMessage,
            "❌ اكتبي اسم الحملة.",
            false
          );

          return;

        }


        if (!reportCode) {

          showMessage(
            addMessage,
            "❌ اكتبي Report Code.",
            false
          );

          return;

        }


        addButton.disabled =
          true;

        addButton.textContent =
          "جاري الإضافة...";


        try {

          /*
            نتأكد أن Report Code
            غير مستخدم بالفعل
          */

          const {
            data: existing,
            error: checkError
          } = await supabaseClient

            .from("campaigns")

            .select("id")

            .eq(
              "report_code",
              reportCode
            );


          if (checkError) {
            throw checkError;
          }


          if (
            existing &&
            existing.length > 0
          ) {

            throw new Error(
              "Report Code مستخدم بالفعل. اختاري كودًا آخر."
            );

          }


          /*
            إنشاء UUID تلقائيًا
          */

          const newId =
            crypto.randomUUID();


          /*
            إضافة الحملة
          */

          const {
            error
          } = await supabaseClient

            .from("campaigns")

            .insert({

              id:
                newId,

              campaign_name:
                name,

              impressions:
                impressions,

              status:
                status,

              ad_text:
                adText || null,

              ad_image:
                adImage || null,

              channel_url:
                channelUrl || null,

              report_code:
                reportCode,

              last_updated:
                new Date().toISOString()

            });


          if (error) {
            throw error;
          }


          showMessage(
            addMessage,
            "✅ تمت إضافة الحملة بنجاح.",
            true
          );


          /*
            تنظيف النموذج
          */

          document.getElementById(
            "newCampaignName"
          ).value = "";

          document.getElementById(
            "newReportCode"
          ).value = "";

          document.getElementById(
            "newImpressions"
          ).value = "0";

          document.getElementById(
            "newAdText"
          ).value = "";

          document.getElementById(
            "newAdImage"
          ).value = "";

          document.getElementById(
            "newChannelUrl"
          ).value = "";


          /*
            إعادة تحميل الحملات
          */

          await loadCampaigns();


        } catch (error) {

          console.error(error);

          showMessage(
            addMessage,
            "❌ خطأ أثناء إضافة الحملة: " +
            error.message,
            false
          );

        } finally {

          addButton.disabled =
            false;

          addButton.textContent =
            "➕ إضافة الحملة";

        }

      }
    );


    /* =====================================
       SAVE EDIT
    ===================================== */

    saveButton.addEventListener(
      "click",
      async function() {

        const id =
          campaignSelect.value;


        if (!id) {

          showMessage(
            saveMessage,
            "❌ اختاري حملة أولًا.",
            false
          );

          return;

        }


        saveButton.disabled =
          true;

        saveButton.textContent =
          "جاري الحفظ...";


        try {

          const {
            error
          } = await supabaseClient

            .from("campaigns")

            .update({

              impressions:
                Number(
                  impressionsInput.value ||
                  0
                ),

              status:
                statusInput.value,

              ad_text:
                adTextInput.value.trim() ||
                null,

              ad_image:
                adImageInput.value.trim() ||
                null,

              channel_url:
                channelUrlInput.value.trim() ||
                null,

              last_updated:
                new Date().toISOString()

            })

            .eq(
              "id",
              id
            );


          if (error) {
            throw error;
          }


          showMessage(
            saveMessage,
            "✅ تم حفظ التعديلات بنجاح.",
            true
          );


          await loadCampaigns();


          campaignSelect.value =
            id;


          loadSelectedCampaign();


        } catch (error) {

          console.error(error);

          showMessage(
            saveMessage,
            "❌ خطأ أثناء الحفظ: " +
            error.message,
            false
          );

        } finally {

          saveButton.disabled =
            false;

          saveButton.textContent =
            "💾 حفظ التعديلات";

        }

      }
    );


    /* =====================================
       SELECT CHANGE
    ===================================== */

    campaignSelect.addEventListener(
      "change",
      function() {

        loadSelectedCampaign();

        saveMessage.style.display =
          "none";

      }
    );


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHtml(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================
       START
    ===================================== */

    loadCampaigns();

  </script>

</body>

  </html>
