<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تقرير إعلانات تيليجرام</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .campaign-name {
      color: #666;
      margin-top: 6px;
    }

    .status {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    .status.active {
      background: #e7f7ed;
      color: #16834b;
    }

    .status.inactive {
      background: #fce8e8;
      color: #c0392b;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .stat {
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      padding: 20px;
      background: #fafafa;
    }

    .stat-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: bold;
    }

    .ad-preview {
      margin-top: 25px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
    }

    .ad-box {
      background: #f4f6f8;
      border-radius: 10px;
      padding: 18px;
      margin-top: 15px;
    }

    .ad-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .ad-text {
      line-height: 1.8;
      color: #444;
    }

    .ad-image {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .channel-button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #229ed9;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .updated {
      color: #777;
      font-size: 13px;
      margin-top: 20px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #666;
    }

    .error {
      background: #fdecec;
      color: #b42318;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }

      .topbar {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    📊 تقارير إعلانات تيليجرام
  </div>

  <div class="container">

    <div id="loading" class="loading">
      جاري تحميل بيانات الحملة...
    </div>

    <div id="report" class="card" style="display:none;">

      <div class="header">

        <div>
          <h1>تقرير الحملة</h1>

          <div id="campaignName" class="campaign-name">
            —
          </div>
        </div>

        <span id="status" class="status">
          —
        </span>

      </div>

      <div class="stats">

        <div class="stat">
          <div class="stat-title">
            مرات الظهور
          </div>

          <div id="impressions" class="stat-value">
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-title">
            حالة الحملة
          </div>

          <div id="statusValue" class="stat-value">
            —
          </div>
        </div>

      </div>

      <div class="ad-preview">

        <h2>
          الإعلان
        </h2>

        <div class="ad-box">

          <img id="adImage" class="ad-image" alt="صورة الإعلان">

          <div id="adTitle" class="ad-title">
            إعلان تيليجرام
          </div>

          <div id="adText" class="ad-text">
            —
          </div>

          <a
            id="channelButton"
            class="channel-button"
            href="#"
            target="_blank"
            style="display:none;">
            زيارة القناة
          </a>

        </div>

      </div>

      <div id="updated" class="updated">
        آخر تحديث: —
      </div>

    </div>

    <div id="error" class="error"></div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://oxclimxygexnezblrhpz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LakP2nXyrFIvnpwzj8GEvA_90dL9_LK";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    async function loadCampaign() {

      const loading = document.getElementById("loading");
      const report = document.getElementById("report");
      const errorBox = document.getElementById("error");

      try {

        const { data, error } = await supabaseClient
          .from("campaigns")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(1)
          .single();

        if (error) {
          throw error;
        }

        document.getElementById("campaignName").textContent =
          data.campaign_name || "حملة إعلانية";

        document.getElementById("impressions").textContent =
          Number(data.impressions || 0).toLocaleString("en-US");

        document.getElementById("statusValue").textContent =
          data.status || "—";

        const status = document.getElementById("status");

        status.textContent =
          data.status === "Active"
            ? "● نشطة"
            : "● " + (data.status || "غير معروف");

        if (data.status === "Active") {
          status.classList.add("active");
        } else {
          status.classList.add("inactive");
        }

        document.getElementById("adText").textContent =
          data.ad_text || "لا يوجد نص للإعلان.";

        if (data.ad_image) {
          const image = document.getElementById("adImage");
          image.src = data.ad_image;
          image.style.display = "block";
        }

        if (data.channel_url) {
          const button = document.getElementById("channelButton");
          button.href = data.channel_url;
          button.style.display = "inline-block";
        }

        if (data.last_updated) {

          const date = new Date(data.last_updated);

          document.getElementById("updated").textContent =
            "آخر تحديث: " +
            date.toLocaleString("ar-EG");

        }

        loading.style.display = "none";
        report.style.display = "block";

      } catch (error) {

        console.error(error);

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
          "حدث خطأ أثناء تحميل بيانات الحملة.";

      }

    }

    loadCampaign();

  </script>

</body>
  </html>
