<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝐄𝐋 𝐓𝐀𝐆𝐄𝐑.𝐀𝐝𝐬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:radial-gradient(circle at 50% -10%,#063b78 0%,#03152e 30%,#010713 70%);color:#fff;min-height:100vh}
.top{min-height:105px;background:rgba(3,17,39,.92);border-bottom:2px solid #008cff;display:flex;align-items:center;justify-content:center;padding:18px;box-shadow:0 0 20px rgba(0,140,255,.45)}
.brand{display:flex;align-items:center;justify-content:center;gap:15px}
.logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#168dff,#004fc4);display:flex;align-items:center;justify-content:center;font-size:32px;border:2px solid #35baff;box-shadow:0 0 10px #008cff,0 0 30px rgba(0,140,255,.75)}
.brand h1{margin:0;color:white;font-size:30px;letter-spacing:1px;text-shadow:0 0 10px #008cff}
.brand p{margin:6px 0 0;color:#83cfff;font-size:15px}
.container{width:100%;max-width:1100px;margin:28px auto;padding:0 16px}
.card{background:linear-gradient(145deg,rgba(4,30,62,.96),rgba(1,12,29,.98));border:2px solid #008cff;border-radius:24px;box-shadow:0 0 8px #008cff,0 0 25px rgba(0,140,255,.35),inset 0 0 30px rgba(0,100,200,.12);margin-bottom:20px}
.loading{text-align:center;padding:80px 20px;font-size:20px;color:#9ddcff}
.spinner{width:48px;height:48px;border:4px solid rgba(0,160,255,.2);border-top-color:#00aaff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{padding:35px 20px;text-align:center;color:#ff9da6;font-size:18px}
.update-box{display:flex;justify-content:center;align-items:center;gap:8px;color:#83b9d8;font-size:13px;margin-top:18px}
.update-dot{width:9px;height:9px;border-radius:50%;background:#20ed91;box-shadow:0 0 8px #20ed91,0 0 15px #20ed91}
.ad-card{overflow:hidden}
.ad-header{padding:22px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.ad-title{margin:0;color:white;font-size:27px;font-weight:bold}
.ad-id{color:#71cfff;margin-top:7px;font-size:13px;direction:ltr;text-align:right}
.status{display:inline-flex;align-items:center;gap:7px;border-radius:30px;padding:10px 18px;font-weight:bold;font-size:16px}
.active{background:rgba(0,255,120,.10);color:#32ff9b;border:1px solid #20ee8d;box-shadow:0 0 15px rgba(0,255,120,.25)}
.inactive{background:rgba(255,50,70,.10);color:#ff7d89;border:1px solid #ff5365}
.ad-image-wrap{padding:0 18px 18px}
.ad-image{width:100%;max-height:500px;object-fit:contain;display:block;border-radius:18px;border:1px solid #008cff;background:#020d1e;box-shadow:0 0 15px rgba(0,140,255,.25)}
.no-image{min-height:180px;display:flex;justify-content:center;align-items:center;border:1px dashed #008cff;border-radius:18px;color:#75cfff;background:rgba(0,80,150,.08)}
.ad-text{margin:0 18px 20px;padding:18px;background:rgba(1,17,38,.85);border:1px solid #174d82;border-radius:16px;color:#e8f7ff;line-height:1.9;font-size:16px;white-space:pre-wrap}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:20px}
.metric{position:relative;overflow:hidden;min-height:205px;padding:22px;background:linear-gradient(145deg,rgba(4,31,64,.97),rgba(1,12,29,.98));border:2px solid #008cff;border-radius:23px;box-shadow:0 0 8px #008cff,0 0 22px rgba(0,140,255,.32),inset 0 0 25px rgba(0,100,200,.1)}
.metric:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:#008cff;filter:blur(65px);opacity:.12;left:-50px;bottom:-60px}
.metric-head{display:flex;justify-content:space-between;align-items:center}
.metric-title{color:white;font-size:21px}
.metric-icon{font-size:30px}
.metric-value{margin-top:30px;color:white;font-size:46px;font-weight:bold;direction:ltr;text-align:right;text-shadow:0 0 12px rgba(0,160,255,.5)}
.metric-label{color:#82b8d5;margin-top:7px;font-size:14px}
.channel-card{padding:22px}
.channel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.channel-title{color:white;font-size:21px}
.channel-link{display:block;width:100%;padding:20px;border:1px dashed #00aaff;border-radius:18px;color:#75d7ff;text-decoration:none;text-align:center;font-size:16px;word-break:break-all;background:rgba(0,80,150,.06);transition:.2s}
.channel-link:hover{background:rgba(0,130,255,.12);box-shadow:0 0 18px rgba(0,150,255,.25)}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.info-box{background:linear-gradient(145deg,rgba(4,28,58,.95),rgba(1,12,27,.98));border:1px solid #175187;border-radius:18px;padding:18px}
.info-title{color:#69cfff;font-size:13px;margin-bottom:8px}
.info-value{color:white;font-size:15px;word-break:break-all}
.footer{text-align:center;color:#668ba8;padding:30px 15px;font-size:13px}
.refreshing{opacity:.65;transition:.2s}
@media(max-width:700px){
body{background:radial-gradient(circle at 50% -10%,#06366b 0%,#03132a 35%,#010611 75%)}
.top{min-height:95px;padding:15px 10px}.brand{gap:10px}.logo{width:54px;height:54px;font-size:26px}.brand h1{font-size:22px}.brand p{font-size:12px}
.container{margin-top:18px;padding:0 10px}.ad-header{padding:18px}.ad-title{font-size:21px}.metrics{grid-template-columns:1fr;gap:15px}.metric{min-height:175px}.metric-value{font-size:40px}.info{grid-template-columns:1fr}
}
.ad-id{display:none!important}.info{display:none!important}.metrics .metric:nth-child(3){display:none!important}
.report-disabled{padding:55px 25px;text-align:center}
.report-disabled-icon{font-size:52px;margin-bottom:15px}
.report-disabled-title{font-size:24px;font-weight:bold;color:#fff;margin-bottom:12px}
.report-disabled-text{font-size:16px;color:#9ddcff;line-height:1.8}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">📊</div><div><h1>𝐄𝐋 𝐓𝐀𝐆𝐄𝐑.𝐀𝐝𝐬</h1><p>تقارير إعلانات تيليجرام</p></div></div></header>
<main class="container">
<div id="loading" class="card loading"><div class="spinner"></div>جاري تحميل التقرير...</div>
<div id="error" class="card error" style="display:none"></div>
<div id="app" style="display:none">
<section id="adCard" class="card ad-card"></section>
<section id="metrics" class="metrics"></section>
<section id="channelCard" class="card channel-card"></section>
<section id="info" class="info"></section>
<div class="update-box"><span class="update-dot"></span><span id="updateText">التحديث التلقائي يعمل</span></div>
</div>
</main>
<footer class="footer">𝐄𝐋 𝐓𝐀𝐆𝐄𝐑.𝐀𝐝𝐬<br>شفافية ونتائج حقيقية • النتائج يتم تحديثها تلقائيًا</footer>
<script>
const SUPABASE_URL="https://oxclimxygexnezblrhpz.supabase.co";
const SUPABASE_KEY="sb_publishable_LakP2nXyrFIvnpwz8GEvA_90dL9_LK";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function num(value){return Number(value||0).toLocaleString("en-US");}
function formatDate(value){if(!value)return "";try{return new Date(value).toLocaleString("ar-EG",{year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return String(value);}}
function isActive(status){const s=String(status||"").toLowerCase();return s==="active"||s.includes("running")||s.includes("active")||s.includes("نشط");}
function statusText(status){if(!status)return "غير محددة";const s=String(status).toLowerCase();if(s.includes("active")||s.includes("running"))return "نشط";if(s.includes("paused")||s.includes("stopped"))return "متوقفة";return String(status);}
function showError(message){$("loading").style.display="none";$("app").style.display="none";$("error").style.display="block";$("error").textContent=message;}
function showDisabledReport(){
$("loading").style.display="none";$("app").style.display="none";$("error").style.display="block";
$("error").innerHTML=`<div class="report-disabled"><div class="report-disabled-icon">⛔</div><div class="report-disabled-title">التقرير غير متاح حاليًا</div><div class="report-disabled-text">تم إيقاف هذا التقرير مؤقتًا.<br>يرجى التواصل مع المسؤول إذا كنت بحاجة إلى مزيد من المعلومات.</div></div>`;
}
function renderReport(c){
const active=isActive(c.status);const status=statusText(c.status);
let imageHTML="";
if(c.ad_image){imageHTML=`<div class="ad-image-wrap"><img class="ad-image" src="${esc(c.ad_image)}" alt="صورة الإعلان" onerror="this.outerHTML='<div class=&quot;no-image&quot;>📷 صورة الإعلان غير متاحة</div>'"></div>`;}
else{imageHTML=`<div class="ad-image-wrap"><div class="no-image">📷 لا توجد صورة للإعلان</div></div>`;}
$("adCard").innerHTML=`<div class="ad-header"><div><h1 class="ad-title">${esc(c.campaign_name||"إعلان Telegram Ads")}</h1><div class="ad-id">Telegram Ad ID: ${esc(c.telegram_ad_id||"-")}</div></div><div class="status ${active?"active":"inactive"}">● ${esc(status)}</div></div>${imageHTML}<div class="ad-text">${esc(c.ad_text||"لا يوجد نص للإعلان.")}</div>`;
$("metrics").innerHTML=`
<div class="metric"><div class="metric-head"><div class="metric-title">المشاهدات</div><div class="metric-icon">📊</div></div><div class="metric-value">${num(c.impressions)}</div><div class="metric-label">إجمالي مرات الظهور</div></div>
<div class="metric"><div class="metric-head"><div class="metric-title">الحالة</div><div class="metric-icon">🛡️</div></div><div class="metric-value" style="font-size:38px">${esc(status)}</div><div class="metric-label">حالة الإعلان الحالية</div></div>
<div class="metric"><div class="metric-head"><div class="metric-title">الانضمام</div><div class="metric-icon">👥</div></div><div class="metric-value">${num(c.actions)}</div><div class="metric-label">إجمالي المنضمين</div></div>
<div class="metric"><div class="metric-head"><div class="metric-title">آخر تحديث</div><div class="metric-icon">🔄</div></div><div class="metric-value" style="font-size:22px;line-height:1.6">${esc(formatDate(c.last_updated))}</div><div class="metric-label">البيانات تتحدث تلقائيًا</div></div>`;
if(c.channel_url){$("channelCard").innerHTML=`<div class="channel-head"><div class="channel-title">🔗 لينك القناة</div><div>•••</div></div><a class="channel-link" href="${esc(c.channel_url)}" target="_blank" rel="noopener noreferrer">🔗 زيارة القناة</a>`;}
else{$("channelCard").innerHTML=`<div class="channel-head"><div class="channel-title">🔗 لينك القناة</div><div>•••</div></div><div class="channel-link">لا يوجد رابط قناة</div>`;}
$("info").innerHTML=`<div class="info-box"><div class="info-title">Report Code</div><div class="info-value">${esc(c.report_code||"-")}</div></div><div class="info-box"><div class="info-title">Telegram Ad ID</div><div class="info-value">${esc(c.telegram_ad_id||"-")}</div></div>`;
}
async function load(){
try{
const params=new URLSearchParams(window.location.search);const code=(params.get("code")||"").trim();
if(!code){showError("❌ رابط التقرير غير مكتمل.");return;}
$("app").classList.add("refreshing");
const {data,error}=await db.from("campaigns").select("id,client_id,campaign_name,impressions,status,ad_text,ad_image,channel_url,last_updated,actions,report_code,telegram_ad_id,report_enabled").eq("report_code",code).limit(1);
if(error)throw error;
if(!data||data.length===0){showError("❌ لا يوجد إعلان مرتبط برابط التقرير هذا.");return;}
const campaign=data[0];
if(campaign.report_enabled===false){showDisabledReport();return;}
renderReport(campaign);
$("loading").style.display="none";$("error").style.display="none";$("app").style.display="block";$("app").classList.remove("refreshing");
const now=new Date().toLocaleTimeString("ar-EG");$("updateText").textContent=`آخر تحديث ${now} · التحديث التلقائي يعمل`;
}catch(error){console.error("REPORT ERROR:",error);$("app").classList.remove("refreshing");showError("❌ تعذر تحميل بيانات الإعلان. تأكدي من إعدادات Supabase.");}
}
const URL_PARAMS=new URLSearchParams(window.location.search);const REPORT_CODE=(URL_PARAMS.get("code")||"").trim();
load();
setInterval(()=>{if(REPORT_CODE)load();},30000);
if(REPORT_CODE){
db.channel("campaign-report-"+REPORT_CODE).on("postgres_changes",{event:"*",schema:"public",table:"campaigns"},payload=>{if(payload.new&&payload.new.report_code===REPORT_CODE)load();}).subscribe();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load();});
window.addEventListener("online",()=>load());
</script>
</body>
  </html>
