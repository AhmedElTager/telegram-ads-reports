<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تقارير إعلانات تيليجرام</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .topbar {
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .campaign-name {
      color: #666;
      margin-top: 6px;
      font-size: 15px;
    }

    .status {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    .status.active {
      background: #e7f7ed;
      color: #16834b;
    }

    .status.inactive {
      background: #fdecec;
      color: #c0392b;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .stat {
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      padding: 20px;
      background: #fafafa;
    }

    .stat-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: bold;
    }

    .ad-preview {
      margin-top: 25px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
    }

    .ad-box {
      background: #f4f6f8;
      border-radius: 10px;
      padding: 18px;
      margin-top: 15px;
    }

    .ad-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .ad-text {
      line-height: 1.8;
      color: #444;
      white-space: pre-line;
    }

    .ad-image {
      width: 100%;
      max-width: 600px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .channel-button {
      display: none;
      margin-top: 15px;
      padding: 12px 20px;
      background: #229ed9;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .channel-button:hover {
      opacity: 0.9;
    }

    .updated {
      color: #777;
      font-size: 13px;
      margin-top: 20px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #666;
      font-size: 16px;
    }

    .error {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #fdecec;
      color: #b42318;
      line-height: 1.7;
      direction: ltr;
      text-align: left;
      word-break: break-word;
    }

    .success-info {
      margin-top: 20px;
      padding: 14px;
      background: #f0f7ff;
      border-radius: 8px;
      color: #345;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .container {
        margin: 15px auto;
      }

      .card {
        padding: 18px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .stat-value {
        font-size: 26px;
      }

      .topbar {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    📊 تقارير إعلانات تيليجرام
  </div>

  <div class="container">

    <!-- Loading -->
    <div id="loading" class="loading">
      جاري تحميل بيانات الحملة...
    </div>

    <!-- Report -->
    <div id="report" class="card" style="display: none;">

      <div class="header">

        <div>
          <h1>تقرير الحملة</h1>

          <div id="campaignName" class="campaign-name">
            —
          </div>
        </div>

        <span id="status" class="status">
          —
        </span>

      </div>

      <!-- Statistics -->
      <div class="stats">

        <div class="stat">

          <div class="stat-title">
            مرات الظهور
          </div>

          <div id="impressions" class="stat-value">
            0
          </div>

        </div>

        <div class="stat">

          <div class="stat-title">
            حالة الحملة
          </div>

          <div id="statusValue" class="stat-value">
            —
          </div>

        </div>

      </div>

      <!-- Advertisement -->
      <div class="ad-preview">

        <h2>
          الإعلان
        </h2>

        <div class="ad-box">

          <img
            id="adImage"
            class="ad-image"
            alt="صورة الإعلان">

          <div id="adTitle" class="ad-title">
            إعلان تيليجرام
          </div>

          <div id="adText" class="ad-text">
            —
          </div>

          <a
            id="channelButton"
            class="channel-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer">
            زيارة القناة
          </a>

        </div>

      </div>

      <!-- Last Update -->
      <div id="updated" class="updated">
        آخر تحديث: —
      </div>

      <div class="success-info">
        ℹ️ يتم تحديث بيانات التقرير من قاعدة البيانات.
      </div>

    </div>

    <!-- Error -->
    <div id="error" class="error"></div>

  </div>

  <script>

    /* =========================
       SUPABASE CONNECTION
    ========================= */

    const SUPABASE_URL =
      "https://oxclimxygexnezblrhpz.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_LakP2nXyrFIvnpwzj8GEvA_90dL9_LK";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       LOAD CAMPAIGN
    ========================= */

    async function loadCampaign() {

      const loading =
        document.getElementById("loading");

      const report =
        document.getElementById("report");

      const errorBox =
        document.getElementById("error");


      try {

        console.log("Connecting to Supabase...");


        const { data, error } =
          await supabaseClient

            .from("campaigns")

            .select(
              "id, client_id, campaign_name, impressions, status, ad_text, ad_image, channel_url, start_date, end_date, last_updated, report_code, created_at"
            )

            .order(
              "created_at",
              {
                ascending: false
              }
            )

            .limit(1)

            .single();


        /* =========================
           CHECK DATABASE ERROR
        ========================= */

        if (error) {

          console.error(
            "Supabase error:",
            error
          );

          throw new Error(
            error.message
          );
        }


        /* =========================
           CHECK DATA
        ========================= */

        if (!data) {

          throw new Error(
            "لم يتم العثور على أي حملة في جدول campaigns."
          );
        }


        console.log(
          "Campaign loaded:",
          data
        );


        /* =========================
           CAMPAIGN NAME
        ========================= */

        document.getElementById(
          "campaignName"
        ).textContent =
          data.campaign_name ||
          "حملة إعلانية";


        /* =========================
           IMPRESSIONS
        ========================= */

        const impressions =
          Number(
            data.impressions || 0
          );

        document.getElementById(
          "impressions"
        ).textContent =
          impressions.toLocaleString(
            "en-US"
          );


        /* =========================
           STATUS
        ========================= */

        const campaignStatus =
          data.status ||
          "غير معروف";


        document.getElementById(
          "statusValue"
        ).textContent =
          campaignStatus;


        const statusElement =
          document.getElementById(
            "status"
          );


        statusElement.classList.remove(
          "active",
          "inactive"
        );


        if (
          campaignStatus.toLowerCase() ===
          "active"
        ) {

          statusElement.textContent =
            "● نشطة";

          statusElement.classList.add(
            "active"
          );

        } else {

          statusElement.textContent =
            "● " + campaignStatus;

          statusElement.classList.add(
            "inactive"
          );
        }


        /* =========================
           AD TEXT
        ========================= */

        document.getElementById(
          "adText"
        ).textContent =
          data.ad_text ||
          "لا يوجد نص للإعلان.";


        /* =========================
           AD IMAGE
        ========================= */

        if (data.ad_image) {

          const image =
            document.getElementById(
              "adImage"
            );

          image.src =
            data.ad_image;

          image.style.display =
            "block";
        }


        /* =========================
           CHANNEL URL
        ========================= */

        if (data.channel_url) {

          const button =
            document.getElementById(
              "channelButton"
            );

          button.href =
            data.channel_url;

          button.style.display =
            "inline-block";
        }


        /* =========================
           LAST UPDATED
        ========================= */

        if (data.last_updated) {

          const date =
            new Date(
              data.last_updated
            );

          document.getElementById(
            "updated"
          ).textContent =
            "آخر تحديث: " +
            date.toLocaleString(
              "ar-EG"
            );

        } else {

          document.getElementById(
            "updated"
          ).textContent =
            "آخر تحديث: غير متوفر";
        }


        /* =========================
           SHOW REPORT
        ========================= */

        loading.style.display =
          "none";

        report.style.display =
          "block";


      } catch (error) {

        console.error(
          "Error:",
          error
        );


        /* Hide loading */

        loading.style.display =
          "none";


        /* Show error */

        errorBox.style.display =
          "block";


        errorBox.textContent =
          "حدث خطأ أثناء تحميل البيانات: " +
          (error.message || error);
      }
    }


    /* =========================
       START
    ========================= */

    loadCampaign();

  </script>

</body>

  </html>
